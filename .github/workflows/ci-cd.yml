name: CI-CD

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - feature/**
      - feat/**

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  ci:
    name: Build and Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: FrontEnd/package-lock.json

      - name: FrontEnd install
        working-directory: FrontEnd
        run: npm ci

      - name: FrontEnd lint
        working-directory: FrontEnd
        run: npm run lint

      - name: FrontEnd build
        working-directory: FrontEnd
        run: npm run build

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore API solution
        working-directory: API
        run: dotnet restore API.sln

      - name: Build API solution
        working-directory: API
        run: dotnet build API.sln --configuration Release --no-restore

      - name: Test API solution
        working-directory: API
        run: dotnet test API.sln --configuration Release --no-build

      - name: Publish API application artifact
        working-directory: API/GameApp/GameApp.Application
        run: dotnet publish -c Release -o ../../publish/app

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Python service dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flask pillow

      - name: Python service smoke test
        run: |
          python -c "import flask, PIL"
          python -m py_compile PythonComparison/ComparisonAPI.py

      - name: Upload FrontEnd artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: FrontEnd/dist
          if-no-files-found: error

      - name: Upload API artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-publish
          path: API/GameApp/publish/app
          if-no-files-found: error

  deploy_staging:
    name: Deploy to Staging (starter)
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: staging

    steps:
      - name: Download FrontEnd artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: ./artifacts/frontend

      - name: Download API artifact
        uses: actions/download-artifact@v4
        with:
          name: api-publish
          path: ./artifacts/api

      - name: Placeholder staging deploy
        run: |
          echo "TODO: replace with real deployment commands"
          echo "Deploying artifacts to staging..."

      - name: Placeholder staging smoke tests
        run: |
          echo "TODO: replace with real smoke tests"
          echo "Checking API/auth/lobby/drawings/comparison"

  deploy_production:
    name: Deploy to Production (starter)
    runs-on: ubuntu-latest
    needs: deploy_staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Placeholder production deploy
        run: |
          echo "TODO: replace with real deployment commands"
          echo "Deploying same approved artifacts to production..."

      - name: Placeholder post-deploy checks
        run: |
          echo "TODO: replace with real health checks"
          echo "Post-deploy verification complete"
